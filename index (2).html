<style>
:root{--bg:#eef2f6;--card:#fff;--ink:#14213d;--mute:#6b7690;--line:#d5dce6;--acc:#2347d8;--on:#fff;--ff:Onest,system-ui,sans-serif;--r:14px;--hi:#e5484d;--mid:#f5a524;--lo:#2fa36b;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1626;--card:#18213a;--ink:#e8edf8;--mute:#8e9bb8;--line:#2a3555}}
:root[data-theme="dark"]{--bg:#0f1626;--card:#18213a;--ink:#e8edf8;--mute:#8e9bb8;--line:#2a3555}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.5 var(--ff)}
button,input,select{font:inherit;color:inherit}
main{max-width:640px;margin:0 auto;padding:16px 16px 48px}
.hero{background:var(--acc);color:var(--on);border-radius:calc(var(--r)*1.8);padding:16px 22px 22px;margin-bottom:22px}
.top{display:flex;justify-content:space-between;margin-bottom:18px}
.nav{display:flex;gap:6px}
.ic{width:42px;height:42px;border-radius:calc(var(--r)*.8);border:1px solid var(--line);background:var(--card);cursor:pointer;font-size:18px;display:grid;place-items:center}
.hero .ic{background:color-mix(in srgb,var(--on) 18%,transparent);border-color:transparent;color:var(--on)}
h1{display:flex;align-items:baseline;gap:12px;margin:0;font-size:clamp(22px,6vw,30px);font-weight:500}
h1 b{font-size:clamp(84px,26vw,132px);font-weight:800;line-height:.85;letter-spacing:-.05em}
.sub{margin:10px 0 0;font-size:18px;opacity:.85}
.bar{height:10px;background:color-mix(in srgb,var(--on) 25%,transparent);border-radius:99px;margin:22px 0 10px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--on);transition:width .3s}
.stat{margin:0;font-weight:500}
form{display:grid;grid-template-columns:1fr 120px;gap:8px;background:var(--card);border:1px solid var(--line);border-radius:calc(var(--r)*1.3);padding:12px}
form input,form select{border:1px solid var(--line);background:var(--bg);border-radius:calc(var(--r)*.7);padding:10px 12px;min-width:0}
#t{grid-column:1/-1}
.rt{grid-column:1/-1;display:flex;gap:8px;align-items:center;font-size:15px}
.rt input{width:18px;height:18px;padding:0;accent-color:var(--acc)}
form>button{grid-column:1/-1;background:var(--acc);color:var(--on);border:0;border-radius:calc(var(--r)*.7);padding:12px;font-weight:700;cursor:pointer}
ul{list-style:none;margin:6px 0 0;padding:0}
li{display:grid;grid-template-columns:56px auto 1fr auto;gap:12px;align-items:center;border-bottom:1px solid var(--line);padding:14px 0}
.when{font-weight:700;font-variant-numeric:tabular-nums;border-left:4px solid var(--lo);padding-left:10px;align-self:stretch;display:flex;align-items:center}
li.p2 .when{border-left-color:var(--mid)}li.p3 .when{border-left-color:var(--hi)}
li input{width:22px;height:22px;accent-color:var(--acc)}
.tm{display:block;font-size:13px;color:var(--mute)}
li.d .tx{text-decoration:line-through;color:var(--mute)}li.d .when{color:var(--mute);border-left-color:var(--line)}
.del{border:0;background:none;color:var(--mute);font-size:22px;cursor:pointer;padding:4px 8px}
li.empty{display:block;text-align:center;color:var(--mute);border:0;padding:32px 0}
#ov{position:fixed;inset:0;background:rgba(0,0,0,.45);opacity:0;pointer-events:none;transition:opacity .25s;z-index:10}
#pn{position:fixed;top:0;bottom:0;left:0;width:min(340px,88vw);background:var(--card);z-index:20;padding:calc(16px + env(safe-area-inset-top,0px)) 20px 24px;overflow-y:auto;transform:translateX(-100%);visibility:hidden;transition:transform .25s,visibility .25s}
body.open #pn{transform:none;visibility:visible}body.open #ov{opacity:1;pointer-events:auto}
.ph{display:flex;justify-content:space-between;align-items:center}
h2{margin:0;font-size:22px}h3{margin:22px 0 8px;font-size:15px;color:var(--mute);font-weight:500}
.seg,.sws{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.seg button{flex:1 1 auto;padding:9px 12px;border:1px solid var(--line);background:var(--bg);border-radius:calc(var(--r)*.6);cursor:pointer}
.seg button[aria-pressed=true]{background:var(--acc);color:var(--on);border-color:var(--acc)}
.sw{width:34px;height:34px;border-radius:50%;border:3px solid var(--card);box-shadow:0 0 0 1px var(--line);cursor:pointer}
.sw[aria-pressed=true]{box-shadow:0 0 0 3px var(--ink)}
#cc{width:44px;height:34px;padding:0;border:0;background:none;cursor:pointer}
.rs{margin-top:26px;width:100%;padding:11px;border:1px solid var(--line);background:none;border-radius:calc(var(--r)*.7);cursor:pointer}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:12px 18px;border-radius:calc(var(--r)*.8);z-index:30;max-width:90vw;font-weight:500}
main{padding-bottom:104px}
.hero{padding:12px 18px 16px;border-radius:calc(var(--r)*1.5)}
.top{margin-bottom:8px}
h1 b{font-size:clamp(52px,15vw,76px)}
.sub{margin-top:6px;font-size:16px}
.hero .bar{margin:14px 0 8px;height:8px}
.v{display:none}.v.on{display:block}
.vh{display:flex;align-items:center;gap:12px;margin-bottom:16px}.vh h2{font-size:26px}
.nav2{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:space-around;background:var(--card);border-top:1px solid var(--line);padding:8px 8px calc(8px + env(safe-area-inset-bottom,0px));z-index:5}
.nav2 button{flex:1;max-width:120px;display:grid;justify-items:center;gap:2px;background:none;border:0;color:var(--mute);font-size:12px;padding:6px;cursor:pointer;border-radius:calc(var(--r)*.8)}
.nav2 button[aria-pressed=true]{color:var(--acc);font-weight:700}
.av{width:52px;height:52px;border-radius:50%;border:0;background:var(--acc) center/cover;color:var(--on);font:800 22px var(--ff);cursor:pointer;display:grid;place-items:center;flex:none}
.ph{gap:12px}.pi{flex:1;display:grid;min-width:0;cursor:pointer}.pi span{color:var(--mute);font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.gl{display:grid;gap:6px;margin-top:18px}
.gl button{text-align:left;padding:11px 14px;border:1px solid var(--line);background:var(--bg);border-radius:calc(var(--r)*.7);cursor:pointer}
.gl button[aria-pressed=true]{background:var(--acc);color:var(--on);border-color:var(--acc)}
.sh{margin:26px 0 0;font-size:18px}
.md{position:fixed;inset:0;z-index:40;background:rgba(0,0,0,.5);display:none;align-items:center;justify-content:center;padding:16px}.md.on{display:flex}
.md>div{background:var(--card);border-radius:calc(var(--r)*1.5);padding:22px;width:min(440px,100%);max-height:90vh;overflow:auto}
.opts{display:grid;gap:8px;margin:14px 0}
.opts button,.pg,.pb{padding:12px 14px;border-radius:calc(var(--r)*.7);border:1px solid var(--line);background:var(--bg);cursor:pointer;text-align:left}
.pb{background:var(--acc);color:var(--on);border-color:var(--acc);font-weight:700;text-align:center}.pg{text-align:center}
.row{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}.row>button{flex:1}
.fl{display:grid;gap:4px;margin-top:12px;font-size:14px;color:var(--mute)}
.fl input,.fl select{padding:10px 12px;border:1px solid var(--line);background:var(--bg);border-radius:calc(var(--r)*.7);color:var(--ink);min-width:0}
.f3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.gr{display:flex;justify-content:space-between;gap:10px;padding:12px 0;border-bottom:1px solid var(--line)}
.bn{background:var(--card);border:1px solid var(--line);border-radius:calc(var(--r)*1.3);padding:14px;margin-bottom:14px}.bn p{margin:0}
.bars{display:flex;align-items:flex-end;gap:8px;height:150px;margin:8px 0 18px}
.bars div{flex:1;height:100%;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:6px;font-size:12px;color:var(--mute)}
.bars i{width:100%;background:var(--acc);border-radius:calc(var(--r)*.4);min-height:4px}
.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.cards div{background:var(--card);border:1px solid var(--line);border-radius:calc(var(--r)*.9);padding:12px;font-size:13px;color:var(--mute)}.cards b{display:block;font-size:26px;color:var(--ink)}
.ring{width:190px;height:190px;border-radius:50%;background:conic-gradient(var(--acc) calc(var(--p)*1%),var(--line) 0);display:grid;place-items:center;margin:20px auto}
.ring span{width:150px;height:150px;border-radius:50%;background:var(--bg);display:grid;place-items:center;font-size:40px;font-weight:800}
.gt{text-align:center;font-size:20px;margin:0}
.pph{display:flex;align-items:center;gap:12px;cursor:pointer;margin-top:10px}
.mq{font-size:20px;line-height:1.4;margin:14px 0}
p.empty{text-align:center;color:var(--mute);padding:28px 0}
#g{grid-column:1/-1}
:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
